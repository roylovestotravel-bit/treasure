<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT50 | PA E-Bike Warehouse Bicicletas eléctricas</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<header class="product-detail-header">
<a class="brand" href="index.html">PA E-Bike Warehouse</a>
<nav><a href="index.html#products">Productos</a><a href="index.html#about">Nosotros</a><a href="index.html#contact">Contacto</a></nav>
<div class="language-switch" aria-label="Idioma"><a href="../gt50.html" lang="en">EN</a><span class="active">ES</span></div>
</header>
<main class="product-detail">
<a class="back-link" href="index.html#products">← Volver a todos los productos</a>
<div class="product-detail-grid">
<div class="product-gallery" aria-label="Galería de fotos de GT50">
<div class="gallery-stage">
<img id="gt50-main-image" class="product-detail-image" src="../bike1.jpg" alt="Foto de producto de la bicicleta eléctrica GT50 1 de 5">
<button class="gallery-arrow gallery-prev" type="button" aria-label="Foto anterior">‹</button>
<button class="gallery-arrow gallery-next" type="button" aria-label="Foto siguiente">›</button>
<div class="gallery-counter" aria-live="polite">1 / 5</div>
</div>
<div class="gallery-thumbnails" aria-label="Elegir una foto">
<button class="gallery-thumbnail active" type="button" data-index="0" aria-label="Ver foto 1"><img src="../bike1.jpg" alt=""></button>
<button class="gallery-thumbnail" type="button" data-index="1" aria-label="Ver foto 2"><img src="../gt50-gallery-warehouse.jpg" alt=""></button>
<button class="gallery-thumbnail" type="button" data-index="2" aria-label="Ver foto 3"><img src="../gt50-gallery-front.jpg" alt=""></button>
<button class="gallery-thumbnail" type="button" data-index="3" aria-label="Ver foto 4"><img src="../gt50-gallery-side.jpg" alt=""></button>
<button class="gallery-thumbnail" type="button" data-index="4" aria-label="Ver foto 5"><img src="../gt50-gallery-pickup-private.png" alt=""></button>
</div>
</div>
<section>
<h1>GT50</h1>
<p class="product-intro">Una bicicleta eléctrica versátil para la ciudad y los recorridos al aire libre.</p>
<div class="specs-coming-soon">Especificaciones próximamente.</div>
</section>
</div>
</main>
<footer>© 2026 PA E-Bike Warehouse</footer>
<script>
(() => {
  const images = ["../bike1.jpg", "../gt50-gallery-warehouse.jpg", "../gt50-gallery-front.jpg", "../gt50-gallery-side.jpg", "../gt50-gallery-pickup-private.png"];
  const mainImage = document.getElementById("gt50-main-image");
  const counter = document.querySelector(".gallery-counter");
  const thumbnails = [...document.querySelectorAll(".gallery-thumbnail")];
  let current = 0;
  function show(index) {
    current = (index + images.length) % images.length;
    mainImage.src = images[current];
    mainImage.alt = `Foto de producto de la bicicleta eléctrica GT50 ${current + 1} de ${images.length}`;
    counter.textContent = `${current + 1} / ${images.length}`;
    thumbnails.forEach((button, i) => {
      button.classList.toggle("active", i === current);
      button.setAttribute("aria-current", i === current ? "true" : "false");
    });
    thumbnails[current].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
  }
  document.querySelector(".gallery-prev").addEventListener("click", () => show(current - 1));
  document.querySelector(".gallery-next").addEventListener("click", () => show(current + 1));
  thumbnails.forEach(button => button.addEventListener("click", () => show(Number(button.dataset.index))));
  document.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft") show(current - 1);
    if (event.key === "ArrowRight") show(current + 1);
  });
})();
</script>
</body>
</html>
